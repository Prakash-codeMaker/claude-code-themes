<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code Themes</title>
<meta name="description" content="Every theme for Claude Code, in one place. Preview, customise and install.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14' fill='%23d77757'>✻</text></svg>">
<style>
:root { --page: #fff; --ink: #111; --dim: #6b6b6b; --line: #e6e6e6; --field: #f5f5f4; --accent: #d77757; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --page: #0e0e10; --ink: #ededed; --dim: #8b8b8b; --line: #26262a; --field: #18181b; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 56px 16px 96px; }
a { color: inherit; }
h1 { font-size: 34px; letter-spacing: -.02em; margin: 0 0 20px; }
h1 span { color: var(--accent); }
h2 { font-size: 20px; letter-spacing: -.01em; margin: 64px 0 16px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono, pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.copy { display: block; width: 100%; max-width: 520px; text-align: left; white-space: pre; overflow-x: auto; background: var(--field); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
.copy:hover, .card:hover, .row:hover { border-color: var(--dim); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 40px 0 16px; position: sticky; top: 0; padding: 12px 0; background: var(--page); z-index: 1; }
.bar input[type=search] { flex: 1 1 200px; min-width: 0; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
.bar label { display: flex; }
.bar label input { position: absolute; opacity: 0; }
.bar label span { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.bar label input:checked + span { background: var(--ink); color: var(--page); border-color: var(--ink); }
.bar label input:focus-visible + span, button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: none; padding: 0; text-align: left; display: block; width: 100%; }
.card footer { padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.card footer b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card footer i { font-style: normal; color: var(--dim); white-space: nowrap; }
.term { background: var(--bg); color: var(--text); padding: 12px; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; overflow: hidden; }
.term .user { background: var(--userMessageBackground); padding: 0 4px; margin: 2px 0; }
.term .del { background: var(--diffRemoved); margin-left: 12px; padding: 0 4px; }
.term .add { background: var(--diffAdded); margin-left: 12px; padding: 0 4px; }
.term .prompt { border: 1px solid var(--promptBorder); border-radius: 5px; padding: 1px 6px; margin: 6px 0 4px; color: var(--inactive); }
.term .bash { border-left: 2px solid var(--bashBorder); padding-left: 6px; margin: 4px 0; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.row { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.row > a { font-weight: 600; text-decoration: none; }
.row small { color: var(--dim); font-size: 13px; }
.row .copy { font-size: 12px; padding: 6px 8px; border-radius: 6px; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--page); color: var(--ink); padding: 0; width: min(880px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: #0009; }
.edit { display: grid; grid-template-columns: 1fr 1fr; }
.edit > div { padding: 20px; min-width: 0; }
.edit .side { border-left: 1px solid var(--line); max-height: calc(100dvh - 26px); overflow-y: auto; }
.edit .term { border-radius: 10px; font-size: 13px; border: 1px solid var(--line); }
.edit input[type=text] { background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
#name { width: 100%; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
#credit { color: var(--dim); font-size: 13px; margin: 0 0 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.actions button, .actions a { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; background: none; text-decoration: none; font-size: 14px; }
.actions .main { background: var(--ink); color: var(--page); border-color: var(--ink); }
.tok { display: grid; grid-template-columns: 28px 1fr 96px; gap: 8px; align-items: center; margin-bottom: 6px; font-size: 12px; }
.tok input[type=color] { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.tok span { overflow: hidden; text-overflow: ellipsis; }
.tok input[type=text] { font-size: 12px; width: 96px; }
#add { width: 100%; margin-top: 8px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
#toast { position: fixed; bottom: 24px; left: 50%; translate: -50%; background: var(--ink); color: var(--page); padding: 8px 16px; border-radius: 99px; font-size: 14px; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 9; }
#toast.on { opacity: 1; }
[hidden] { display: none !important; }
@media (max-width: 700px) { .edit { grid-template-columns: 1fr; } .edit .side { border-left: 0; border-top: 1px solid var(--line); max-height: none; } dialog { overflow-y: auto; } h1 { font-size: 28px; } .bar input[type=search] { flex-basis: 100%; } }
</style>
</head>
<body>
<main>
  <h1><span>✻</span> Claude Code Themes</h1>
  <button class="copy mono" data-copy="/plugin marketplace add anhnt256/claude-code-themes
/plugin install themes@claude-code-themes">/plugin marketplace add anhnt256/claude-code-themes
/plugin install themes@claude-code-themes</button>

  <div class="bar">
    <input type="search" id="q" placeholder="Search" aria-label="Search themes" autocomplete="off">
    <label><input type="radio" name="mode" value="" checked><span id="all">All</span></label>
    <label><input type="radio" name="mode" value="dark"><span>Dark</span></label>
    <label><input type="radio" name="mode" value="light"><span>Light</span></label>
  </div>
  <div class="grid" id="grid"></div>

  <h2 id="more-h">More terminal themes</h2>
  <div class="list" id="more"></div>

  <h2>Desktop app</h2>
  <div class="list" id="desktop"></div>

  <h2>Theme builders</h2>
  <div class="list" id="tools"></div>
</main>

<dialog id="dlg" aria-labelledby="name">
  <div class="edit">
    <div>
      <input type="text" id="name" aria-label="Theme name">
      <p id="credit"></p>
      <div class="term" id="big"></div>
      <div class="actions">
        <button class="main" id="dl">Download</button>
        <button id="cp">Copy JSON</button>
        <button id="close">Close</button>
      </div>
    </div>
    <div class="side">
      <div id="toks"></div>
      <select id="add" aria-label="Add a colour"></select>
    </div>
  </div>
</dialog>
<div id="toast" role="status"></div>

<template id="mock"><div><span style="color:var(--claude)">✻</span> Welcome back</div><div class="user">&gt; fix the login bug</div><div><span style="color:var(--success)">●</span> Update(auth.ts)</div><div class="del">- const ok = false</div><div class="add">+ const ok = true</div><div class="prompt">&gt;&nbsp;</div><div><span style="color:var(--autoAccept)">⏵⏵ accept edits</span> <span style="color:var(--planMode)">⏸ plan</span> <span style="color:var(--warning)">▲</span> <span style="color:var(--error)">✗</span></div></template>
<template id="mock-big"><div><span style="color:var(--claude)">✻</span> Welcome back</div><div class="user">&gt; fix the login bug</div><div><span style="color:var(--claude)">●</span> I'll update the check in auth.ts.</div><div><span style="color:var(--success)">●</span> Update(auth.ts)</div><div class="del">- const ok = false</div><div class="add">+ const ok = true</div><div class="bash">! npm test</div><div><span style="color:var(--error)">●</span> 1 failed <span style="color:var(--warning)">▲ 2 warnings</span></div><div style="color:var(--permission)">Do you want to proceed?</div><div style="color:var(--subtle)">esc to interrupt</div><div class="prompt">&gt;&nbsp;</div><div><span style="color:var(--autoAccept)">⏵⏵ accept edits</span> <span style="color:var(--planMode)">⏸ plan mode</span></div></template>

<script>
const TOKENS = ['claude','claudeShimmer','text','inverseText','inactive','subtle','suggestion','success','error','warning','merged','remember','promptBorder','bashBorder','permission','planMode','autoAccept','fastMode','effortUltra','skill','ide','diffAdded','diffRemoved','diffAddedDimmed','diffRemovedDimmed','diffAddedWord','diffRemovedWord','userMessageBackground','userMessageBackgroundHover','bashMessageBackgroundColor','memoryBackgroundColor','selectionBg','rate_limit_fill','rate_limit_empty','briefLabelClaude','briefLabelYou','red_FOR_SUBAGENTS_ONLY','blue_FOR_SUBAGENTS_ONLY','green_FOR_SUBAGENTS_ONLY','yellow_FOR_SUBAGENTS_ONLY','purple_FOR_SUBAGENTS_ONLY','orange_FOR_SUBAGENTS_ONLY','pink_FOR_SUBAGENTS_ONLY','cyan_FOR_SUBAGENTS_ONLY']
const $ = (id) => document.getElementById(id)
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids); return n }
const gh = (repo) => 'https://github.com/' + repo

function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1400) }
async function copy(text) { try { await navigator.clipboard.writeText(text); toast('Copied') } catch { toast('Copy failed') } }
document.addEventListener('click', (e) => { const b = e.target.closest('[data-copy]'); if (b) copy(b.dataset.copy) })

function toHex(v) {
  v = String(v).trim().toLowerCase()
  if (/^#[0-9a-f]{6}$/.test(v)) return v
  if (/^#[0-9a-f]{3}$/.test(v)) return '#' + [...v.slice(1)].map((c) => c + c).join('')
  const m = v.match(/^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/)
  return m ? '#' + m.slice(1).map((n) => Math.min(255, +n).toString(16).padStart(2, '0')).join('') : null
}
function paint(node, colors) { for (const [k, v] of Object.entries(colors)) node.style.setProperty('--' + k, v) }

let data, current
function card(t) {
  const term = el('div', { className: 'term' }); term.append($('mock').content.cloneNode(true)); paint(term, t.colors)
  const c = el('button', { className: 'card' }, term, el('footer', {}, el('b', { textContent: t.name }), el('i', { textContent: t.author })))
  c.onclick = () => open(t)
  return c
}
function filter() {
  const q = $('q').value.trim().toLowerCase(), mode = document.querySelector('[name=mode]:checked').value
  const list = data.themes.filter((t) => (!mode || (mode === 'light') === t.light) && (!q || (t.name + ' ' + t.slug + ' ' + t.author).toLowerCase().includes(q)))
  $('grid').replaceChildren(...list.map(card))
}

function open(t) {
  current = { slug: t.slug, base: t.base, light: t.light, overrides: { ...t.overrides } }
  $('name').value = t.name
  $('credit').replaceChildren('by ', el('a', { href: gh(t.author), textContent: t.author, target: '_blank', rel: 'noopener' }), ' · ', el('a', { href: t.url, textContent: 'source', target: '_blank', rel: 'noopener' }), ' · ' + t.license)
  $('big').replaceChildren($('mock-big').content.cloneNode(true))
  rows(); repaint(); $('dlg').showModal()
}
function repaint() {
  const colors = { ...data.defaults[current.light ? 'light' : 'dark'] }
  for (const [k, v] of Object.entries(current.overrides)) { const h = toHex(v); if (h) colors[k] = h }
  paint($('big'), colors)
}
function rows() {
  $('toks').replaceChildren(...Object.keys(current.overrides).map((k) => {
    const hex = toHex(current.overrides[k])
    const pick = el('input', { type: 'color', value: hex ?? '#000000', ariaLabel: k })
    const text = el('input', { type: 'text', value: current.overrides[k], className: 'mono', ariaLabel: k + ' value', spellcheck: false })
    pick.oninput = () => { text.value = current.overrides[k] = pick.value; repaint() }
    text.oninput = () => { const h = toHex(text.value); if (h) { current.overrides[k] = text.value.trim(); pick.value = h; repaint() } }
    return el('div', { className: 'tok' }, pick, el('span', { textContent: k, className: 'mono', title: k }), text)
  }))
  $('add').replaceChildren(el('option', { value: '', textContent: 'Add a colour' }), ...TOKENS.filter((k) => !(k in current.overrides)).map((k) => el('option', { textContent: k })))
}
$('add').onchange = (e) => { if (!e.target.value) return; current.overrides[e.target.value] = data.defaults[current.light ? 'light' : 'dark'][e.target.value] ?? '#888888'; rows(); repaint(); $('toks').lastChild.scrollIntoView({ block: 'nearest' }) }
const json = () => JSON.stringify({ name: $('name').value.trim() || current.slug, base: current.base, overrides: current.overrides }, null, 2) + '\n'
$('cp').onclick = () => copy(json())
$('dl').onclick = () => {
  const a = el('a', { href: URL.createObjectURL(new Blob([json()], { type: 'application/json' })), download: current.slug + '.json' })
  a.click(); URL.revokeObjectURL(a.href); toast('Save it to ~/.claude/themes/')
}
$('close').onclick = () => $('dlg').close()
$('dlg').onclick = (e) => { if (e.target === $('dlg')) $('dlg').close() }

const row = (title, href, sub, cmds = []) => el('div', { className: 'row' }, el('a', { href, textContent: title, target: '_blank', rel: 'noopener' }), el('small', { textContent: sub }), ...cmds.map((c) => { const b = el('button', { className: 'copy mono', textContent: c }); b.dataset.copy = c; return b }))

fetch('themes.json').then((r) => r.json()).then((d) => {
  data = d
  $('all').textContent = 'All ' + d.themes.length
  filter()
  $('q').oninput = filter
  document.querySelectorAll('[name=mode]').forEach((r) => (r.onchange = filter))
  $('more').replaceChildren(...d.linked.map((s) => row(s.repo.split('/')[1], gh(s.repo), `${s.repo.split('/')[0]} · ${s.count} themes`)))
  $('more-h').hidden = !d.linked.length
  $('desktop').replaceChildren(...d.desktop.map((t) => row(t.name, gh(t.repo) + (t.path ? '/tree/HEAD/' + t.path : ''), t.author, t.install)))
  $('tools').replaceChildren(...d.tools.map((t) => row(t.name, t.url ?? gh(t.repo), t.author)))
})
</script>
</body>
</html>
